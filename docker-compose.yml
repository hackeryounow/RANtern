# RANtern — Docker Compose (参考 VoxEra 架构适配)
# 本地开发: docker compose up --build
# 生产部署: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build

services:
  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: rantern-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - rantern-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: rantern-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rantern}
      POSTGRES_USER: ${POSTGRES_USER:-rantern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rantern_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - rantern-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rantern} -d ${POSTGRES_DB:-rantern}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Python FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rantern-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rantern}:${POSTGRES_PASSWORD:-rantern_dev}@postgres:5432/${POSTGRES_DB:-rantern}
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rantern-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./backend/data:/app/data
      - ./backend/coresimrunner:/app/coresimrunner
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/core:/app/config/core:ro

  # ── Asterisk (SIP / WebRTC PBX) ──
  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
      args:
        CONFIG_REVISION: ${IMAGE_TAG:-local}
    container_name: rantern-asterisk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/asterisk-healthcheck.sh"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 180s
    ports:
      - "${ASTERISK_WSS_PORT:-8089}:${ASTERISK_WSS_PORT:-8089}/tcp"
      - "${ASTERISK_SIP_PORT:-5060}:5060/udp"
      - "${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10099}:${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10099}/udp"
    volumes:
      - asterisk-logs:/var/log/asterisk
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ASTERISK_EXTERNAL_IP: ${ASTERISK_EXTERNAL_IP:-${PUBLIC_HOST:-127.0.0.1}}
      ASTERISK_WS_PORT: ${ASTERISK_WSS_PORT:-8089}
      ASTERISK_UID: ${ASTERISK_UID:-1000}
      ASTERISK_GID: ${ASTERISK_GID:-1000}
    networks:
      - rantern-net

  # ── Frontend (React + Vite → Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
        VITE_SIP_WS_URL: ${VITE_SIP_WS_URL:-ws://${ASTERISK_EXTERNAL_IP:-127.0.0.1}:8089/ws}
        VITE_SIP_URI: ${VITE_SIP_URI:-sip:1001@${ASTERISK_EXTERNAL_IP:-127.0.0.1}}
        VITE_SIP_PASSWORD: ${VITE_SIP_PASSWORD:-1001}
    container_name: rantern-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rantern-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  rantern-net:
    driver: bridge

volumes:
  redis-data:
  pgdata:
  asterisk-logs: